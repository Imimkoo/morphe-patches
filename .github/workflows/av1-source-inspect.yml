name: AV1 source APK inspection

on:
  push:
    branches:
      - "ibrahim/universal-video-control"
    paths:
      - ".github/workflows/av1-source-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch APKMirror download page
        shell: bash
        run: |
          set +e
          mkdir -p source-inspection
          URL="https://www.apkmirror.com/apk/google-inc/youtube/youtube-21-30-216-release/youtube-21-30-216-2-android-apk-download/"
          curl --location --retry 2 --retry-delay 3 --connect-timeout 20 --max-time 180 \
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36" \
            --dump-header source-inspection/response-headers.txt \
            --output source-inspection/download-response.bin \
            --write-out "HTTP_CODE=%{http_code}\nFINAL_URL=%{url_effective}\nCONTENT_TYPE=%{content_type}\nSIZE=%{size_download}\n" \
            "$URL" > source-inspection/curl-summary.txt 2>&1
          echo "CURL_EXIT=$?" >> source-inspection/curl-summary.txt
          file source-inspection/download-response.bin > source-inspection/file-type.txt || true
          head -c 32 source-inspection/download-response.bin | od -An -tx1 > source-inspection/magic-bytes.txt || true
          if head -c 4 source-inspection/download-response.bin | grep -q 'PK'; then
            cp source-inspection/download-response.bin source-inspection/youtube-21.30.216.apk
            sha256sum source-inspection/youtube-21.30.216.apk > source-inspection/sha256.txt
            echo "APK_DOWNLOAD=SUCCESS" > source-inspection/result.txt
          else
            echo "APK_DOWNLOAD=NOT_AN_APK" > source-inspection/result.txt
            echo "The response was preserved for diagnosis; no anti-bot or access control was bypassed." >> source-inspection/result.txt
          fi
      - name: Upload source inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-21.30.216-source-inspection
          path: source-inspection/
          if-no-files-found: error
          retention-days: 7
