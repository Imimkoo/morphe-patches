name: Ibrahim AV1 renderer source analysis

on:
  push:
    branches:
      - "ibrahim/universal-video-control"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified stock APK artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-21.30.216-stock-av1-inspection
          repository: ${{ github.repository }}
          run-id: 45085016704
          github-token: ${{ github.token }}
          path: source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download JADX
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 \
            https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          jadx/bin/jadx --version

      - name: Decompile AV1 classes only
        shell: bash
        run: |
          set -euo pipefail
          APK="source/youtube-stock.apk"
          mkdir -p av1-source
          for CLASS in \
            com.google.android.exoplayer.youtube.mediacodec.Dav1dDecoderHelper \
            androidx.media3.decoder.av1.Dav1dDecoder \
            androidx.media3.decoder.av1.Dav1dLibrary \
            androidx.media3.decoder.av1.Libdav1dVideoRenderer; do
            SAFE="${CLASS//./_}"
            echo "===== $CLASS =====" | tee -a av1-source/summary.txt
            jadx/bin/jadx --no-res --threads-count 4 --single-class "$CLASS" \
              --single-class-output "av1-source/$SAFE.java" "$APK" 2>&1 | tee -a av1-source/jadx.log || true
          done
          unzip -p "$APK" lib/arm64-v8a/libdav1dJNI.so > av1-source/libdav1dJNI.so
          sha256sum av1-source/libdav1dJNI.so > av1-source/native-sha256.txt
          file av1-source/libdav1dJNI.so > av1-source/native-file.txt
          {
            echo "=== Extracted Java source files ==="
            find av1-source -maxdepth 1 -name '*.java' -print
            echo "=== Helper/renderer source preview ==="
            for f in av1-source/*.java; do
              echo "===== $f ====="
              sed -n '1,1200p' "$f"
            done
          } | tee av1-source/report.txt

      - name: Upload AV1 implementation source
        uses: actions/upload-artifact@v4
        with:
          name: youtube-21.30.216-av1-source-code
          path: av1-source/
          if-no-files-found: error
          retention-days: 14
