name: Ibrahim AV1 renderer source analysis

on:
  push:
    branches:
      - "ibrahim/universal-video-control"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download verified stock APK artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-21.30.216-stock-av1-inspection
          repository: ${{ github.repository }}
          run-id: 45085016704
          github-token: ${{ github.token }}
          path: source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download JADX
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 \
            https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          jadx/bin/jadx --version

      - name: Decompile YouTube and extract AV1 implementation
        shell: bash
        run: |
          set -euo pipefail
          APK="source/youtube-stock.apk"
          test -s "$APK"
          mkdir -p decompiled
          jadx/bin/jadx --no-res --threads-count 8 --show-bad-code -d decompiled "$APK" 2>&1 | tee jadx.log
          mkdir -p av1-source
          grep -RIlE 'CODEC_SPLICE_DAV1D|Dav1dDecoderHelper|sf_swap\.dav1d|DISABLE_DAV1D|DAV1D_SAME_CONDITION|Libdav1dVideoRenderer|dav1dJNI' decompiled/sources \
            | sort > av1-source/matching-classes.txt || true
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            {
              echo
              echo "===== $file ====="
              sed -n '1,1200p' "$file"
            } >> av1-source/av1-implementation-source.txt
          done < av1-source/matching-classes.txt
          echo "=== Embedded dav1d native library ===" | tee av1-source/native-library.txt
          unzip -p "$APK" lib/arm64-v8a/libdav1dJNI.so > av1-source/libdav1dJNI.so
          sha256sum av1-source/libdav1dJNI.so | tee -a av1-source/native-library.txt
          file av1-source/libdav1dJNI.so | tee -a av1-source/native-library.txt
          readelf -d av1-source/libdav1dJNI.so | tee -a av1-source/native-library.txt || true
          echo "=== Match summary ==="
          cat av1-source/matching-classes.txt
          wc -l av1-source/av1-implementation-source.txt

      - name: Upload AV1 implementation source
        uses: actions/upload-artifact@v4
        with:
          name: youtube-21.30.216-av1-source-code
          path: |
            av1-source/
            jadx.log
          if-no-files-found: error
          retention-days: 14
