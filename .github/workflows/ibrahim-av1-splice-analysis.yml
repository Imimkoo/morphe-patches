name: Ibrahim AV1 splice renderer analysis

on:
  push:
    branches:
      - "ibrahim/universal-video-control"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download verified stock APK artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-21.30.216-stock-av1-inspection
          repository: ${{ github.repository }}
          run-id: 45085016704
          github-token: ${{ github.token }}
          path: source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download JADX
        run: |
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 \
            https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Decompile DEX files containing AV1 splice code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dex-in decompiled av1-splice
          unzip -p source/youtube-stock.apk classes.dex > dex-in/classes.dex
          unzip -p source/youtube-stock.apk classes4.dex > dex-in/classes4.dex
          for DEX in dex-in/classes.dex dex-in/classes4.dex; do
            NAME=$(basename "$DEX" .dex)
            mkdir -p "decompiled/$NAME"
            jadx/bin/jadx --no-res --threads-count 8 --show-bad-code \
              -d "decompiled/$NAME" "$DEX" >"av1-splice/$NAME-jadx.log" 2>&1 || true
          done
          grep -RIlE 'CODEC_SPLICE_DAV1D|sf_swap\.dav1d|Dav1dDecoderHelper|createDav1dDecoder|disableDav1d|DAV1D_SAME_CONDITION' \
            decompiled > av1-splice/matching-classes.txt || true
          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue
            {
              echo
              echo "===== $FILE ====="
              sed -n '1,1600p' "$FILE"
            } >> av1-splice/av1-splice-source.txt
          done < av1-splice/matching-classes.txt
          echo "=== Matching classes ==="
          cat av1-splice/matching-classes.txt
          echo "=== Source lines ==="
          wc -l av1-splice/av1-splice-source.txt || true

      - name: Upload splice renderer source
        uses: actions/upload-artifact@v4
        with:
          name: youtube-21.30.216-av1-splice-source
          path: av1-splice/
          if-no-files-found: error
          retention-days: 14
