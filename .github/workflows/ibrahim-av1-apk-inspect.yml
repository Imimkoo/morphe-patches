name: Ibrahim AV1 stock APK inspection

on:
  push:
    branches:
      - "ibrahim/universal-video-control"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download and verify YouTube 21.30.216 stock APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p av1-inspection
          APK_URL="https://archive.org/download/jhc-apks/apks/com.google.android.youtube/com.google.android.youtube-21.30.216-arm64-v8a.apk"
          EXPECTED_SHA256="3775a15129dcc4e5b80fc17b7e0841b7fdd1ca89a6e72baa798806f666c74d02"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 600 \
            "$APK_URL" -o av1-inspection/youtube-stock.apk
          ACTUAL_SHA256="$(sha256sum av1-inspection/youtube-stock.apk | cut -d' ' -f1)"
          echo "Expected SHA256: $EXPECTED_SHA256"
          echo "Actual SHA256:   $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          file av1-inspection/youtube-stock.apk
          unzip -l av1-inspection/youtube-stock.apk | tee av1-inspection/apk-contents.txt | tail -n 35

      - name: Inspect DEX player and decoder references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p av1-inspection/dex
          unzip -j -o av1-inspection/youtube-stock.apk 'classes*.dex' -d av1-inspection/dex >/dev/null
          {
            echo "=== DEX references: Media3 / ExoPlayer / AV1 ==="
            for f in av1-inspection/dex/*.dex; do
              echo "--- $f ---"
              strings "$f" | grep -Ei 'androidx/media3|com/google/android/exoplayer2|Libdav1d|Dav1d|DefaultRenderersFactory|MediaCodecVideoRenderer|RenderersFactory|ExoPlayerImpl|VideoRenderer' | sort -u | head -n 600 || true
            done
            echo "=== Native libraries in APK ==="
            unzip -l av1-inspection/youtube-stock.apk | grep -E 'lib/[^ ]+\.so$' || true
          } | tee av1-inspection/player-decoder-references.txt

      - name: Upload verified source and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: youtube-21.30.216-stock-av1-inspection
          path: av1-inspection/
          if-no-files-found: error
          retention-days: 14
