name: Ibrahim AV1 stock APK inspection

on:
  push:
    branches:
      - "ibrahim/universal-video-control"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download and verify YouTube 21.30.216 stock APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p av1-inspection
          BASE="https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
          EXPECTED_SHA256="3775a15129dcc4e5b80fc17b7e0841b7fdd1ca89a6e72baa798806f666c74d02"
          FOUND=0
          for VARIANT in arm64-v8a all; do
            URL="$BASE/com.google.android.youtube-21.30.216-$VARIANT.apk"
            echo "Trying $URL"
            if curl --fail --location --retry 1 --connect-timeout 20 --max-time 600 "$URL" -o "av1-inspection/candidate-$VARIANT.apk"; then
              ACTUAL="$(sha256sum "av1-inspection/candidate-$VARIANT.apk" | cut -d' ' -f1)"
              echo "$VARIANT SHA256=$ACTUAL"
              if [ "$ACTUAL" = "$EXPECTED_SHA256" ]; then
                mv "av1-inspection/candidate-$VARIANT.apk" av1-inspection/youtube-stock.apk
                echo "SOURCE_VARIANT=$VARIANT" | tee av1-inspection/source.txt
                FOUND=1
                break
              fi
            fi
            rm -f "av1-inspection/candidate-$VARIANT.apk"
          done
          if [ "$FOUND" != 1 ]; then
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 \
              "https://archive.org/metadata/jhc-apks" -o av1-inspection/archive-metadata.json || true
            if [ -s av1-inspection/archive-metadata.json ]; then
              jq -r '.files[] | select(.name | contains("com.google.android.youtube") and contains("21.30.216")) | [.name, (.size // ""), (.sha256 // "")] | @tsv' \
                av1-inspection/archive-metadata.json | tee av1-inspection/archive-candidates.txt || true
            fi
            echo "SOURCE_APK_NOT_FOUND_OR_HASH_MISMATCH" | tee av1-inspection/result.txt
            exit 1
          fi
          file av1-inspection/youtube-stock.apk
          sha256sum av1-inspection/youtube-stock.apk | tee av1-inspection/sha256.txt
          unzip -l av1-inspection/youtube-stock.apk | tee av1-inspection/apk-contents.txt | tail -n 35

      - name: Inspect DEX player and decoder references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p av1-inspection/dex
          unzip -j -o av1-inspection/youtube-stock.apk 'classes*.dex' -d av1-inspection/dex >/dev/null
          {
            echo "=== DEX references: Media3 / ExoPlayer / AV1 ==="
            for f in av1-inspection/dex/*.dex; do
              echo "--- $f ---"
              strings "$f" | grep -Ei 'androidx/media3|com/google/android/exoplayer2|Libdav1d|Dav1d|DefaultRenderersFactory|MediaCodecVideoRenderer|RenderersFactory|ExoPlayerImpl|VideoRenderer' | sort -u | head -n 600 || true
            done
            echo "=== Native libraries in APK ==="
            unzip -l av1-inspection/youtube-stock.apk | grep -E 'lib/[^ ]+\.so$' || true
          } | tee av1-inspection/player-decoder-references.txt

      - name: Upload verified source and inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-21.30.216-stock-av1-inspection
          path: av1-inspection/
          if-no-files-found: error
          retention-days: 14
