name: AV1 branch validation

on:
  push:
    branches:
      - feat/av1-prefer-force

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate XML resources
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('patches/src/main/resources/addresources/values/youtube/strings.xml'); ET.parse('patches/src/main/resources/addresources/values/youtube/arrays.xml'); print('XML_VALID')"
      - name: Run requested tests
        run: ./gradlew :patches:test :extensions:youtube:testDebugUnitTest :extensions:music:testDebugUnitTest --no-daemon
      - name: Build Android bundle
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Upload .mpp artifact
        uses: actions/upload-artifact@v4
        with:
          name: patches-mpp
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: error
