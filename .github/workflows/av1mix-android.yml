name: AV1 Mix Android Build

on:
  workflow_dispatch:
  push:
    branches: ["ibrahim/av1-multisource-player", "ibrahim/multisource-product-foundation"]
    paths:
      - "av1-multisource-player/**"
      - ".github/workflows/av1mix-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: av1mix-debug-keystore-v1
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Smoke-test AdultEmbed public API
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_CODE="$(curl --silent --show-error --max-time 25 -w '%{http_code}' \
            "https://adultembed.com/api/v1/search?per_page=1&quality=complete&lang=ar&sort=popular" \
            -o /tmp/adultembed-search.json)"
          echo "AdultEmbed search HTTP: ${SEARCH_CODE}"
          test "${SEARCH_CODE}" = "200"
          echo "Search JSON keys: $(jq -r 'keys | join(",")' /tmp/adultembed-search.json)"
          jq -e '.results | type == "array" and length > 0' /tmp/adultembed-search.json >/dev/null || {
            echo "Search results array missing or empty."
            exit 1
          }
          VIDEO_ID="$(jq -r '.results[0].id' /tmp/adultembed-search.json)"
          jq -e '.results[0].embed.url | test("^https://adultembed\\.com/player/embed/")' /tmp/adultembed-search.json >/dev/null || {
            echo "Official embed URL missing or outside the provider host."
            exit 1
          }
          STATUS_CODE="$(curl --silent --show-error --max-time 25 -w '%{http_code}' \
            "https://adultembed.com/api/v1/videos/${VIDEO_ID}/status" \
            -o /tmp/adultembed-status.json)"
          echo "AdultEmbed status HTTP: ${STATUS_CODE}"
          test "${STATUS_CODE}" = "200"
          echo "Status response: $(jq -c '{active, playable, status}' /tmp/adultembed-status.json)"
          jq -e '(.active // .playable // (.status == "active")) == true' /tmp/adultembed-status.json >/dev/null || {
            echo "Video status did not confirm active/playable."
            exit 1
          }
          echo "AdultEmbed search, official-player URL, and availability checks passed."
      - name: Run unit tests
        working-directory: av1-multisource-player
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - name: Build debug APK
        working-directory: av1-multisource-player
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and AV1 libraries
        working-directory: av1-multisource-player
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | tee native-libraries.txt
          grep -E 'lib/arm64-v8a/.*(avcodec|dav1d|ffmpeg)' native-libraries.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -p "$APK" lib/arm64-v8a/libavcodec.so > /tmp/av1mix-libavcodec.so
          strings /tmp/av1mix-libavcodec.so | grep -q 'dav1d AV1 decoder by VideoLAN'
          strings /tmp/av1mix-libavcodec.so | grep -q 'enable-decoder=libdav1d'
          sha256sum "$APK" | tee SHA256SUMS.txt
      - name: Upload APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: av1mix-debug-apk
          path: |
            av1-multisource-player/app/build/outputs/apk/debug/app-debug.apk
            av1-multisource-player/SHA256SUMS.txt
            av1-multisource-player/native-libraries.txt
          if-no-files-found: error
          retention-days: 14
